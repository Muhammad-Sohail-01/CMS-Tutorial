<!DOCTYPE html>
<html>
<head>
    <title>CMS Tutorial Series</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            transition: 0.3s;
        }

        .dark {
            background: #121212;
            color: white;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .search {
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        .toggle-btn {
            padding: 8px 12px;
            border: none;
            background: black;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        /* MAIN */
        .main {
            display: flex;
            width: 90%;
            margin: 20px auto;
            gap: 20px;
        }

        /* VIDEO PLAYER */
        .video-player {
            flex: 2;
            background: white;
            padding: 15px;
            border-radius: 10px;
        }

        .dark .video-player {
            background: #1e1e1e;
        }

        iframe {
            width: 100%;
            height: 450px;
            border-radius: 10px;
        }

        /* PLAYLIST */
        .playlist {
            flex: 1;
            background: white;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 500px;
        }

        .dark .playlist {
            background: #1e1e1e;
        }

        .video-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            align-items: center;
        }

        .dark .video-item {
            border-bottom: 1px solid #333;
        }

        .video-item:hover {
            background: #f1f1f1;
        }

        .dark .video-item:hover {
            background: #333;
        }

        .video-item img {
            width: 80px;
            height: 50px;
            border-radius: 5px;
        }

        .active {
            background: #dfefff;
        }

        .dark .active {
            background: #444;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Course Registration Series</h1>

    <div class="controls">
        <input type="text" class="search" placeholder="Search videos..." onkeyup="searchVideos(this.value)">
        <button class="toggle-btn" onclick="toggleDark()">🌙</button>
    </div>
</div>

<div class="main">

    <!-- VIDEO -->
    <div class="video-player">
        <iframe id="mainVideo"
            src="https://drive.google.com/file/d/1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB/preview"
            allowfullscreen>
        </iframe>
    </div>

    <!-- PLAYLIST -->
    <div class="playlist" id="playlist">

        <div class="video-item active"
            data-title="Course Registration for Coordinators"
            onclick="playVideo('1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB', this)">
            <img src="https://via.placeholder.com/80x50">
            <span>Course Registration for Coordinators</span>
        </div>

        <div class="video-item"
            data-title="Add Drop Courses"
            onclick="playVideo('FILE_ID_2', this)">
            <img src="https://via.placeholder.com/80x50">
            <span>Add/Drop Courses</span>
        </div>

        <div class="video-item"
            data-title="Final Submission"
            onclick="playVideo('FILE_ID_3', this)">
            <img src="https://via.placeholder.com/80x50">
            <span>Final Submission</span>
        </div>

    </div>

</div>

<script>

function playVideo(id, element) {
    document.getElementById("mainVideo").src =
        "https://drive.google.com/file/d/" + id + "/preview";

    let items = document.querySelectorAll(".video-item");
    items.forEach(item => item.classList.remove("active"));

    element.classList.add("active");
}

function searchVideos(query) {
    let items = document.querySelectorAll(".video-item");
    query = query.toLowerCase();

    items.forEach(item => {
        let title = item.getAttribute("data-title").toLowerCase();
        item.style.display = title.includes(query) ? "flex" : "none";
    });
}

function toggleDark() {
    document.body.classList.toggle("dark");
}

</script>

</body>
</html>
