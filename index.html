<!DOCTYPE html>
<html>
<head>
    <title>CMS Tutorial Series</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: white;
        }

        /* HEADER */
        .header {
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
            background: #141414;
            border-bottom: 1px solid #222;
        }

        /* MAIN LAYOUT */
        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        /* VIDEO */
        .video-section {
            flex: 2;
        }

        iframe {
            width: 100%;
            height: 60vh;
            border-radius: 10px;
            border: none;
        }

        .video-title {
            margin-top: 10px;
            font-size: 18px;
        }

        /* PLAYLIST */
        .playlist {
            flex: 1;
            background: #1a1a1a;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 70vh;
        }

        .playlist h3 {
            padding: 15px;
            margin: 0;
            border-bottom: 1px solid #333;
        }

        .video-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            align-items: center;
            transition: 0.3s;
        }

        .video-item:hover {
            background: #2a2a2a;
        }

        .video-item img {
            width: 90px;
            border-radius: 6px;
        }

        .video-item span {
            font-size: 14px;
        }

        .active {
            background: #333;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }

            iframe {
                height: 220px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    🎓 CMS Tutorial
</div>

<div class="main">

    <!-- VIDEO LEFT -->
    <div class="video-section">
      <iframe id="mainVideo"
    src="https://drive.google.com/file/d/1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB/preview"
    allow="autoplay; fullscreen"
    allowfullscreen>
</iframe>

        <div class="video-title" id="videoTitle">
            CMS Semester Course Registration Part I
        </div>
    </div>

    <!-- PLAYLIST RIGHT -->
    <div class="playlist">
        <h3>CMS Course Registration Series</h3>

        <div class="video-item active"
            onclick="playVideo('1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB', this, 'Course Registration for Coordinators')">
             <span>1.</span>
            <span>CMS Semester Course Regisration Part I</span>
        </div>

        <div class="video-item"
            onclick="playVideo('16-L6S9Rq3RTKHIfYxiDBLtBJpb6uIzPz', this, 'Faculty/timetable and attendance')">
             <span>2.</span>
            <span>How to Add Faculty, Timetable and Create Attendance Part II</span>
        </div>

        <div class="video-item"
            onclick="playVideo('1lWqQtp7Oz0-PKq5AAgRvszvmhdeM4mj1', this, 'Single Course Registration')">
             <span>3.</span>
            <span>Single Course Registration</span>
        </div>

    </div>

</div>

<script>
function playVideo(id, element, title) {
    document.getElementById("mainVideo").src =
        "https://drive.google.com/file/d/" + id + "/preview";

    document.getElementById("videoTitle").innerText = title;

    let items = document.querySelectorAll(".video-item");
    items.forEach(item => item.classList.remove("active"));

    element.classList.add("active");
}
</script>

</body>
</html>
