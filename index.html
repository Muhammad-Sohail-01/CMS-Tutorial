<!DOCTYPE html>
<html>
<head>
    <title>CMS Tutorial Series</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #007bff, #00c6ff);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
        }

        /* MAIN LAYOUT */
        .main {
            display: flex;
            width: 90%;
            margin: 20px auto;
            gap: 20px;
        }

        /* VIDEO PLAYER */
        .video-player {
            flex: 2;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .video-player iframe {
            width: 100%;
            height: 450px;
            border-radius: 10px;
        }

        /* PLAYLIST */
        .playlist {
            flex: 1;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            max-height: 500px;
        }

        .playlist h3 {
            margin: 0;
            padding: 15px;
            background: #eee;
            border-radius: 10px 10px 0 0;
        }

        .video-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
            transition: 0.3s;
        }

        .video-item:hover {
            background: #f1f1f1;
        }

        .active {
            background: #dfefff;
            font-weight: bold;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Course Registration Series</h1>
    <p>Learn step-by-step CMS course registration process</p>
</div>

<!-- MAIN CONTENT -->
<div class="main">

    <!-- VIDEO PLAYER -->
    <div class="video-player">
        <iframe id="mainVideo"
            src="https://drive.google.com/file/d/1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB/preview"
            allowfullscreen>
        </iframe>
    </div>

    <!-- PLAYLIST -->
    <div class="playlist">
        <h3>Playlist</h3>

        <div class="video-item active"
            onclick="playVideo('1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB', this)">
            ▶ Course Registration for Coordinators
        </div>

        <div class="video-item"
            onclick="playVideo('FILE_ID_2', this)">
            ▶ Add/Drop Courses
        </div>

        <div class="video-item"
            onclick="playVideo('FILE_ID_3', this)">
            ▶ Final Submission
        </div>

    </div>

</div>

<script>
    function playVideo(id, element) {
        document.getElementById("mainVideo").src =
            "https://drive.google.com/file/d/" + id + "/preview";

        // remove active class
        let items = document.querySelectorAll(".video-item");
        items.forEach(item => item.classList.remove("active"));

        // add active class
        element.classList.add("active");
    }
</script>

</body>
</html>
