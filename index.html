<!DOCTYPE html>
<html>
<head>
    <title>CMS Tutorial Series</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        /* HEADER */
        .header {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #141414;
            border-bottom: 1px solid #222;
        }

        /* VIDEO PLAYER */
        .player-container {
            width: 100%;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        iframe {
            width: 100%;
            height: 60vh;
            border-radius: 10px;
            border: none;
        }

        .video-title {
            margin-top: 10px;
            font-size: 18px;
        }

        /* SECTION */
        .section {
            margin: 30px 0;
            padding: 0 20px;
        }

        .section h2 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        /* ROW (Netflix style) */
        .row {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding-bottom: 10px;
        }

        .row::-webkit-scrollbar {
            display: none;
        }

        /* VIDEO CARD */
        .card {
            min-width: 220px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            border-radius: 8px;
        }

        .card-title {
            font-size: 14px;
            margin-top: 5px;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            iframe {
                height: 220px;
            }

            .card {
                min-width: 160px;
            }
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    🎓 CMS Tutorial Series
</div>

<!-- VIDEO PLAYER -->
<div class="player-container">
    <iframe id="mainVideo"
        src="https://drive.google.com/file/d/1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB/preview">
    </iframe>

    <div class="video-title" id="videoTitle">
        Course Registration for Coordinators
    </div>
</div>

<!-- SECTION -->
<div class="section">
    <h2>📚 Course Registration</h2>

    <div class="row">

        <div class="card"
            onclick="playVideo('1v-K6CcbqCdNolYFBiwHY4qYtknaBDjSB','Course Registration for Coordinators')">
            <img src="https://via.placeholder.com/300x170">
            <div class="card-title">Course Registration for Coordinators</div>
        </div>

        <div class="card"
            onclick="playVideo('FILE_ID_2','Add/Drop Courses')">
            <img src="https://via.placeholder.com/300x170">
            <div class="card-title">Add/Drop Courses</div>
        </div>

        <div class="card"
            onclick="playVideo('FILE_ID_3','Final Submission')">
            <img src="https://via.placeholder.com/300x170">
            <div class="card-title">Final Submission</div>
        </div>

    </div>
</div>

<script>
function playVideo(id, title) {
    document.getElementById("mainVideo").src =
        "https://drive.google.com/file/d/" + id + "/preview";

    document.getElementById("videoTitle").innerText = title;
}
</script>

</body>
</html>
